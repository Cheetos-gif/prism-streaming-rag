# Tooling config for ruff and pytest. PRISM is run from a checkout, not
# installed as a package, so there is no [project] table here.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
  "E501",    # line length is enforced by ruff format
  "RUF001",  # ambiguous unicode in strings, e.g. section signs and arrows
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = [
  "controller",
  "ledger",
  "retrieval",
  "scripts",
  "shared",
  "telemetry",
  "tests",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
